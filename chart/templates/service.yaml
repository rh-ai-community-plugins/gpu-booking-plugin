apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-booking.fullname" . }}
  namespace: {{ include "gpu-booking.namespace" . }}
  labels:
    {{- include "gpu-booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "gpu-booking.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
